name: Signed release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prerelease:
        description: Publish as a prerelease
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: signed-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'doccstat/motoappclone' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install pinned SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;37.0.0'
      - name: Fetch pinned Xposed API 82 jar
        run: |
          curl --retry 3 --retry-delay 5 -fsSLo "$RUNNER_TEMP/api-82.jar" \
            https://api.xposed.info/de/robv/android/xposed/api/82/api-82.jar
          echo 'f48c635f1c7469fdec0e00ad2ea0b7a6b2f5b55065784a35b7ca3a84615e8e25  '"$RUNNER_TEMP/api-82.jar" \
            | sha256sum -c -
      - name: Test, sign with the permanent key and verify the certificate
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE: ${{ runner.temp }}/motoappclone-release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
          XPOSED_API_JAR: ${{ runner.temp }}/api-82.jar
          BUILD_DIR: ${{ runner.temp }}/motoappclone-dist
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$SIGNING_KEYSTORE"' EXIT
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode >"$SIGNING_KEYSTORE"
          python3 -B build.py --release
      - name: Publish the manifest-declared version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LISTING_TOKEN: ${{ secrets.LSPOSED_RELEASE_TOKEN }}
          BUILD_DIR: ${{ runner.temp }}/motoappclone-dist
          PRERELEASE: ${{ github.event_name == 'push' || inputs.prerelease }}
        run: |
          set -euo pipefail
          # An old rerun must not replace a newer push's assets.
          head_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head_sha" != "$GITHUB_SHA" ]; then
            echo 'A newer main commit exists; skipping this superseded build.'
            exit 0
          fi
          version_code=$(python3 -c 'import xml.etree.ElementTree as ET; r=ET.parse("AndroidManifest.xml").getroot(); print(r.attrib["{http://schemas.android.com/apk/res/android}versionCode"])')
          version_name=$(python3 -c 'import xml.etree.ElementTree as ET; r=ET.parse("AndroidManifest.xml").getroot(); print(r.attrib["{http://schemas.android.com/apk/res/android}versionName"])')
          tag="$version_code-$version_name"
          latest=false
          if [ "$PRERELEASE" = false ]; then latest=true; fi
          cd "$BUILD_DIR"
          sha256sum -c MotoAppClone.apk.sha256
          cat >release-notes.md <<EOF
          ## Moto App Clone $version_name

          More app clones through Motorola's built-in app cloning.

          - Checks native capabilities and hook contracts instead of firmware fingerprints.
          - Reads platform user-ID bounds and native clone ranges; retains identity,
            permission checks, removal quarantine and boot-retention safeguards.
          - Finds the quota resource by name and discovers Security Center DEX classes
            instead of relying on numeric resources or obfuscated class names.
          - Keeps the configured clone quota and running-user budget of 21472.
          - Adds a redacted, read-only diagnostics command.

          Requires native Motorola app cloning on Android 16+ and a compatible
          Xposed framework. This rewrite passes host tests, not device acceptance.
          Check creation, launch, reboot retention, removal and isolation with
          disposable data before relying on it. The quota is not a capacity claim.
          See the README for scope and firmware-change precautions.

          The APK uses the permanent release key and includes its SHA-256 checksum.
          Older debug-signed installations cannot normally update to this signer
          in place. No device migration or automatic reboot is performed.
          EOF
          releases=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100")
          if jq -e --arg tag "$tag" '[.[][] | select(.tag_name == $tag)] | length > 0' <<<"$releases" >/dev/null; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" --method PATCH \
              -f "sha=$GITHUB_SHA" -F force=true
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
              MotoAppClone.apk MotoAppClone.apk.sha256
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "$version_name" --notes-file release-notes.md \
              --draft=false --prerelease="$PRERELEASE" --latest="$latest"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$version_name" --notes-file release-notes.md \
              --prerelease="$PRERELEASE" --latest="$latest" \
              MotoAppClone.apk MotoAppClone.apk.sha256
          fi
          if [ -n "$LISTING_TOKEN" ]; then
            gh workflow run distribute-release.yml --repo "$GITHUB_REPOSITORY" --ref main -f "tag=$tag"
          else
            echo 'Listing distribution not enabled: submit the package, export its listing, then set LSPOSED_RELEASE_TOKEN.'
          fi
